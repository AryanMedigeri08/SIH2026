version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: udyam-saathi-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_CHAT_KEY=${GROQ_CHAT_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-20b}
      - GOOGLE_TRANSLATE_API_KEY=${GOOGLE_TRANSLATE_API_KEY:-}
      - DATABASE_URL=${DATABASE_URL:-}
      - DATA_GOV_IN_API_KEY=${DATA_GOV_IN_API_KEY:-}
      - AMENITIES_API_BASE_URL=${AMENITIES_API_BASE_URL:-https://api.data.gov.in/resource}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-}
      - FIREBASE_SERVICE_ACCOUNT_JSON=${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      - FIREBASE_SERVICE_ACCOUNT_PATH=${FIREBASE_SERVICE_ACCOUNT_PATH:-serviceAccountKey.json}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - backend-cache:/app/backend/app/data
    networks:
      - udyam-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: udyam-saathi-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - udyam-network

networks:
  udyam-network:
    driver: bridge

volumes:
  backend-cache:
    driver: local
